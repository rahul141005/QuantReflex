<!doctype html><html><body>
<div id="exitDuelModal" class="modal" style="display:none"></div>
<div id="customNumpad" class="custom-numpad"><div class="numpad-grid" data-built="0"></div></div>
<input id="ans" readonly>
<script src="js/ui/overlay.js"></script>
<script src="js/ui/numpad.js"></script>
<script src="js/duel-ui.js"></script>
<script>
window.__results = {};
window.runTest = function () {
  var r = {};
  var confirms = 0, cancels = 0;
  var opts = { answered: 2, total: 8, onConfirm: function(){confirms++;}, onCancel: function(){cancels++;} };
  DuelUI.showExitModal(opts);
  r.afterFirst = document.body.classList.contains('modal-open');
  DuelUI.showExitModal(opts);           // second hardware Back
  r.afterSecond = document.body.classList.contains('modal-open');
  document.getElementById('duExitCancel').click();   // "Keep Solving"
  r.afterKeepSolving_modalOpenSTUCK = document.body.classList.contains('modal-open');
  r.modalDisplay = document.getElementById('exitDuelModal').style.display;
  r.cancels = cancels;
  // Now: is the keypad dead?
  var inp = document.getElementById('ans'); inp.value = '';
  var fired = 0;
  showCustomNumpad(inp, function(){ fired++; });
  document.querySelector('[data-numpad="5"]').click();
  r.inputAfterDigit = inp.value;
  document.querySelector('[data-numpad="submit"]').click();
  r.submitFired = fired;
  return r;
};
</script></body></html>
