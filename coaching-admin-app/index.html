<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e17" />
  <meta name="description" content="QuantReflex Coaching Admin — Monitor student performance, track progress, and manage your coaching institute." />
  <title>QuantReflex Coach</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="css/coaching-style.css" />
</head>
<body>

  <!-- ==================== AUTH SCREEN ==================== -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">QR</div>
      <h1 class="auth-title">Coaching Admin</h1>
      <p class="auth-subtitle">Monitor & elevate your students</p>

      <!-- Auth Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" data-mode="login">Login</button>
        <button class="auth-tab" data-mode="register">Create Account</button>
      </div>

      <!-- Auth Form -->
      <div id="authForm">
        <div class="auth-field">
          <label for="authEmail" class="auth-label">Email</label>
          <input type="email" id="authEmail" class="auth-input" placeholder="you@example.com" autocomplete="email" autocapitalize="off" />
        </div>
        <div class="auth-field">
          <label for="authPassword" class="auth-label">Password</label>
          <div class="password-wrapper">
            <input type="password" id="authPassword" class="auth-input" placeholder="Enter your password" autocomplete="current-password" />
            <button type="button" class="password-toggle-btn" id="togglePasswordVisibility" aria-label="Show password">
              <svg class="eye-icon-show" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg class="eye-icon-hide" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>

        <!-- Register-only field -->
        <div id="registerFields" style="display:none;">
          <div class="auth-field">
            <label for="authCoachingId" class="auth-label">Coaching ID</label>
            <input type="text" id="authCoachingId" class="auth-input" placeholder="e.g. QRABCD1234" autocomplete="off" autocapitalize="characters" style="text-transform:uppercase;" />
            <div style="font-size:var(--font-xs);color:var(--text-muted);margin-top:4px;">Provided by your Super Admin when coaching was created</div>
          </div>
        </div>

        <div id="authError" class="auth-error" style="display:none;"></div>
        <button id="authSubmitBtn" class="auth-btn">Sign In</button>
      </div>
      <p class="auth-footer">🔒 Protected by Firebase Authentication</p>
    </div>
  </div>

  <!-- ==================== APP SHELL ==================== -->
  <div id="appShell" class="app-shell" style="display:none;">

    <!-- Header -->
    <header class="app-header">
      <div>
        <div class="app-header-title" id="headerTitle">Dashboard</div>
      </div>
      <button id="headerRefreshBtn" class="header-refresh-btn" onclick="CoachingApp.handleRefresh()" aria-label="Refresh">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/>
        </svg>
      </button>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
      <div id="view-dashboard" class="view active"></div>
      <div id="view-students" class="view"></div>
      <div id="view-leaderboard" class="view"></div>
      <div id="view-notices" class="view"></div>
      <div id="view-more" class="view"></div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <button class="nav-tab active" data-view="dashboard" onclick="CoachingApp.navigateTo('dashboard')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span class="nav-tab-label">Home</span>
      </button>
      <button class="nav-tab" data-view="students" onclick="CoachingApp.navigateTo('students')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span class="nav-tab-label">Students</span>
      </button>
      <button class="nav-tab" data-view="leaderboard" onclick="CoachingApp.navigateTo('leaderboard')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
        </svg>
        <span class="nav-tab-label">Board</span>
      </button>
      <button class="nav-tab" data-view="notices" onclick="CoachingApp.navigateTo('notices')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
        </svg>
        <span class="nav-tab-label">Notices</span>
      </button>
      <button class="nav-tab" data-view="more" onclick="CoachingApp.navigateTo('more')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>
        </svg>
        <span class="nav-tab-label">More</span>
      </button>
    </nav>

  </div>

  <!-- ==================== BOTTOM SHEET ==================== -->
  <div id="bottomSheetOverlay" class="bottom-sheet-overlay" onclick="BottomSheet.close()"></div>
  <div id="bottomSheet" class="bottom-sheet">
    <div class="bottom-sheet-handle"></div>
    <div class="bottom-sheet-header">
      <div class="bottom-sheet-title" id="bottomSheetTitle"></div>
      <button class="bottom-sheet-close" onclick="BottomSheet.close()">&times;</button>
    </div>
    <div class="bottom-sheet-content" id="bottomSheetContent"></div>
  </div>

  <!-- ==================== TOAST ==================== -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Firebase SDKs (compat v10.12.0 — same as main app) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- App Scripts (layered — dependencies first) -->
  <script src="js/state/store.js"></script>
  <script src="js/firebase/firebase.js"></script>
  <script src="js/firebase/security-events.js"></script>
  <script src="../shared/validation/auth-validators.js"></script>
  <script src="js/firebase/auth.js"></script>
  <script src="js/services/api.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui/toast.js"></script>
  <script src="js/ui/bottom-sheet.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/students.js"></script>
  <script src="js/views/student-profile.js"></script>
  <script src="js/views/leaderboard.js"></script>
  <script src="js/views/notices.js"></script>
  <script src="js/views/more.js"></script>
  <script src="js/app.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.error('ServiceWorker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
