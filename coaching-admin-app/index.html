<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Mobile-first; pinch-zoom ENABLED (WCAG 1.4.4 — ADR-028) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e14" />
  <meta name="description" content="QuantReflex Coaching — a Speed Training Control Center: monitor practice, track solving speed, and intervene when students slip." />
  <title>QuantReflex Coach</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="css/coaching-style.css" />
</head>
<body>

  <!-- ==================== AUTH SCREEN ==================== -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">QR</div>
      <h1 class="auth-title">Coaching Console</h1>
      <p class="auth-subtitle">Monitor speed · motivate students · intervene early</p>

      <!-- Auth Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" data-mode="login">Login</button>
        <button class="auth-tab" data-mode="register">Create Account</button>
      </div>

      <!-- Auth Form -->
      <div id="authForm">
        <div class="auth-field">
          <label for="authEmail" class="auth-label">Email</label>
          <input type="email" id="authEmail" class="auth-input" placeholder="you@example.com" autocomplete="email" autocapitalize="off" />
        </div>
        <div class="auth-field">
          <label for="authPassword" class="auth-label">Password</label>
          <div class="password-wrapper">
            <input type="password" id="authPassword" class="auth-input" placeholder="Enter your password" autocomplete="current-password" />
            <button type="button" class="password-toggle-btn" id="togglePasswordVisibility" aria-label="Show password">
              <svg class="eye-icon-show" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg class="eye-icon-hide" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>

        <!-- Register-only field: a one-time Registration Token issued by the Super Admin (NOT the Coaching ID) -->
        <div id="registerFields" style="display:none;">
          <div class="auth-field">
            <label for="authCoachingId" class="auth-label">Registration Token</label>
            <input type="text" id="authCoachingId" class="auth-input" placeholder="e.g. QRABCD1234" autocomplete="off" autocapitalize="characters" style="text-transform:uppercase;" />
            <div style="font-size:var(--font-xs);color:var(--text-muted);margin-top:4px;">The one-time token your Super Admin gave you when the coaching was created.</div>
          </div>
        </div>

        <div id="authError" class="auth-error" style="display:none;"></div>
        <button id="authSubmitBtn" class="auth-btn">Sign In</button>
      </div>
      <p class="auth-footer">🔒 Protected by Firebase Authentication</p>
    </div>
  </div>

  <!-- ==================== APP SHELL ==================== -->
  <div id="appShell" class="app-shell" style="display:none;">

    <!-- Header -->
    <header class="app-header">
      <div>
        <div class="app-header-title" id="headerTitle">Dashboard</div>
      </div>
      <button id="headerRefreshBtn" class="header-refresh-btn" onclick="CoachingApp.handleRefresh()" aria-label="Refresh">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/>
        </svg>
      </button>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
      <div id="view-dashboard" class="view active"></div>
      <div id="view-students" class="view"></div>
      <div id="view-performance" class="view"></div>
      <div id="view-engagement" class="view"></div>
      <div id="view-settings" class="view"></div>
    </main>

    <!-- Bottom Navigation (5 tabs, mobile-first; safe-area inset handled in CSS) -->
    <nav class="bottom-nav" role="tablist" aria-label="Primary">
      <button class="nav-tab active" data-view="dashboard" role="tab" aria-label="Dashboard" onclick="CoachingApp.navigateTo('dashboard')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span class="nav-tab-label">Home</span>
      </button>
      <button class="nav-tab" data-view="students" role="tab" aria-label="Students" onclick="CoachingApp.navigateTo('students')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span class="nav-tab-label">Students</span>
      </button>
      <button class="nav-tab" data-view="performance" role="tab" aria-label="Performance" onclick="CoachingApp.navigateTo('performance')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>
        </svg>
        <span class="nav-tab-label">Performance</span>
      </button>
      <button class="nav-tab" data-view="engagement" role="tab" aria-label="Engagement" onclick="CoachingApp.navigateTo('engagement')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>
        </svg>
        <span class="nav-tab-label">Engage</span>
      </button>
      <button class="nav-tab" data-view="settings" role="tab" aria-label="Settings" onclick="CoachingApp.navigateTo('settings')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span class="nav-tab-label">Settings</span>
      </button>
    </nav>

  </div>

  <!-- ==================== BOTTOM SHEET ==================== -->
  <div id="bottomSheetOverlay" class="bottom-sheet-overlay" onclick="BottomSheet.close()"></div>
  <div id="bottomSheet" class="bottom-sheet">
    <div class="bottom-sheet-handle"></div>
    <div class="bottom-sheet-header">
      <div class="bottom-sheet-title" id="bottomSheetTitle"></div>
      <button class="bottom-sheet-close" onclick="BottomSheet.close()">&times;</button>
    </div>
    <div class="bottom-sheet-content" id="bottomSheetContent"></div>
  </div>

  <!-- ==================== TOAST ==================== -->
  <div id="toastContainer" class="toast-container" role="status" aria-live="polite"></div>

  <!-- Firebase SDKs (compat v10.12.0 — same as main app) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- App Scripts (layered — dependencies first) -->
  <script src="js/state/store.js"></script>
  <script src="js/firebase/firebase.js"></script>
  <script src="js/firebase/security-events.js"></script>
  <script src="../shared/validation/auth-validators.js"></script>
  <script src="js/firebase/auth.js"></script>
  <script src="js/services/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui/toast.js"></script>
  <script src="js/ui/bottom-sheet.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/students.js"></script>
  <script src="js/views/student-profile.js"></script>
  <script src="js/views/performance.js"></script>
  <script src="js/views/engagement.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.error('ServiceWorker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
