<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f8fafc" />
  <meta name="description" content="QuantReflex Super Admin Panel — Manage users, questions, and system operations." />
  <title>QuantReflex Admin</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <!-- No-FOUC theme boot (ADR-024): resolve + apply data-theme BEFORE the stylesheet paints. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('qrAdminTheme') || 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/admin-style.css" />
  <!-- ADR-102: app build tag. Bump in LOCKSTEP with sw.js APP_VERSION (scripts/update.check.js enforces it). -->
  <script>window.QR_ADMIN_APP_VERSION = 'v14';</script>
</head>
<body>

  <!-- ==================== LOGIN SCREEN ==================== -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">QR</div>
        <h1 class="login-title">Admin Portal</h1>
        <p class="login-subtitle">Super Admin Access Only</p>
      </div>
      <div id="loginForm">
        <div class="login-field">
          <label for="loginEmail" class="login-label">Email</label>
          <input type="email" id="loginEmail" class="login-input" placeholder="admin@quantreflex.com" autocomplete="email" autocapitalize="off" />
        </div>
        <div class="login-field">
          <label for="loginPassword" class="login-label">Password</label>
          <input type="password" id="loginPassword" class="login-input" placeholder="Enter your password" autocomplete="current-password" />
        </div>
        <div id="loginError" class="login-error" style="display:none;"></div>
        <button id="loginBtn" class="btn accent login-btn">Secure Login</button>
      </div>
      <p class="login-footer">🔒 Protected by Firebase Authentication</p>
    </div>
  </div>

  <!-- ==================== APP SHELL ==================== -->
  <div id="appShell" class="app-shell" style="display:none;">

    <!-- Mobile Header -->
    <header class="mobile-header d-md-none">
      <button id="menuToggleBtn" class="menu-toggle" aria-label="Toggle Menu">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="mobile-brand">QR Admin</div>
      <div style="width:24px;"></div> <!-- spacer -->
    </header>

    <!-- Sidebar Overlay -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">QR</div>
        <div class="sidebar-title">QuantReflex</div>
      </div>
      <nav class="sidebar-nav">
        <a href="#command-center" class="nav-item active" data-view="command-center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg><span class="nav-label">Command Center</span></a>
        <a href="#users" class="nav-item" data-view="users"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="nav-label">Users</span></a>
        <a href="#coachings" class="nav-item" data-view="coachings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-3"/></svg><span class="nav-label">Coachings</span></a>
        <a href="#reports" class="nav-item" data-view="reports"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg><span class="nav-label">Reports</span></a>
        <a href="#revenue" class="nav-item" data-view="revenue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span class="nav-label">Revenue</span></a>
        <a href="#refunds" class="nav-item" data-view="refunds"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg><span class="nav-label">Refunds</span></a>
        <a href="#content" class="nav-item" data-view="content"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span class="nav-label">Content</span></a>
        <a href="#ai" class="nav-item" data-view="ai"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg><span class="nav-label">AI</span></a>
        <a href="#operations" class="nav-item" data-view="operations"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="nav-label">Operations</span></a>
        <a href="#settings" class="nav-item" data-view="settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg><span class="nav-label">Settings</span></a>
        <button id="railCollapseBtn" type="button" aria-label="Collapse navigation"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg><span class="rail-label">Collapse</span></button>
      </nav>
      <div class="sidebar-footer">
        <button id="themeToggleBtn" class="btn btn-outline" aria-label="Toggle theme"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/></svg><span class="nav-label" id="themeToggleLabel">Theme</span></button>
        <button id="logoutBtn" class="btn btn-outline" aria-label="Logout"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span class="nav-label">Logout</span></button>
      </div>
    </aside>

    <!-- Main Content — V2 7-domain shell (ADR-019 / ADR-022). Every domain is a first-class
         entity-360 / Center; no legacy view containers or overlay drawers remain. -->
    <main class="main-content">
      <div id="view-command-center" class="view active"></div>
      <div id="view-users" class="view"></div>
      <div id="view-coachings" class="view"></div>
      <div id="view-reports" class="view"></div>
      <div id="view-revenue" class="view"></div>
      <div id="view-refunds" class="view"></div>
      <div id="view-questions" class="view"></div>
      <div id="view-ai" class="view"></div>
      <div id="view-operations" class="view"></div>
      <div id="view-settings" class="view"></div>
    </main>

  </div>

  <!-- ==================== GLOBAL SEARCH (Cmd+K) ==================== -->
  <div id="globalSearchOverlay" class="search-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:var(--overlay); z-index:2000; backdrop-filter:blur(4px);" onclick="GlobalSearch.close()">
    <div class="search-modal" role="dialog" aria-modal="true" aria-label="Global search" style="width:90%; max-width:600px; margin:10vh auto; background:var(--bg-surface); color:var(--text); border-radius:12px; box-shadow:var(--shadow-float); overflow:hidden;" onclick="event.stopPropagation()">
      <div style="padding:1rem; border-bottom:1px solid var(--border-color); display:flex; align-items:center;">
        <span style="font-size:1.2rem; margin-right:0.5rem;" aria-hidden="true">🔍</span>
        <input type="search" id="globalSearchInput" aria-label="Search by email, uid, or coaching ID" placeholder="Search by email, uid, or coaching ID..." style="width:100%; border:none; outline:none; font-size:1.1rem; padding:0.5rem; background:transparent; color:var(--text);" autocomplete="off" />
      </div>
      <div id="globalSearchResults" role="listbox" aria-label="Search results" style="max-height:400px; overflow-y:auto; background:var(--bg-inset);"></div>
    </div>
  </div>

  <!-- ==================== MODAL CONTAINER ==================== -->
  <div id="modalContainer"></div>

  <!-- ==================== TOAST ==================== -->
  <div id="toastContainer" class="toast-container" role="status" aria-live="polite" aria-atomic="false"></div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- App Scripts (layered like main app) -->
  <script src="js/state/store.js"></script>
  <script src="js/firebase/firebase.js"></script>
  <script src="js/firebase/security-events.js"></script>
  <script src="js/firebase/auth.js"></script>
  <script src="js/services/api.js"></script>
  <script src="js/ui/toast.js"></script>
  <script src="js/ui/modal.js"></script>
  <script src="js/ui/table.js"></script>
  <script src="js/ui/split.js"></script>
  <script src="js/ui/tabs.js"></script>
  <script src="js/ui/update-manager.js"></script>
  <!-- ADR-105: shared DI/LR renderers (byte-identical copies of shared/ui/*, kept in sync by
       scripts/sync-visual-renderers.js) so the Reports detail can re-render a student's reported chart/figure
       instead of only dumping raw JSON (REP-1). Pure, dependency-free; expose window.DICharts / window.LRFigures. -->
  <script src="js/ui/di-charts.js"></script>
  <script src="js/ui/lr-figures.js"></script>
  <!-- ADR-117: canonical entitlement rule (generated mirror of main-app/data/entitlement-core.js).
       Must load before utils.js, whose entitlementState() badge resolver delegates to it. -->
  <script src="js/entitlement-core.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/views/users.js"></script>
  <script src="js/views/coachings.js"></script>
  <script src="js/views/reports.js"></script>
  <script src="js/views/revenue.js"></script>
  <script src="js/views/refunds.js"></script>
  <script src="js/views/questions.js"></script>
  <script src="js/views/ai.js"></script>
  <script src="js/views/operations.js"></script>
  <script src="js/views/command-center.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>

  <!-- Service Worker + in-app update (ADR-102: unified via the shared QRUpdateManager). The module owns
       registration/detection/skip-waiting/cache-purge/reload; this block is admin-themed PRESENTATION only. -->
  <script>
    (function () {
      function showUpdateToast() {
        if (document.getElementById('_swUpdateToast')) return;
        var t = document.createElement('div');
        t.id = '_swUpdateToast';
        t.className = 'update-toast';
        t.setAttribute('role', 'status');
        t.textContent = '🚀 New version available. Update from Settings';
        t.addEventListener('click', function () { t.remove(); window.location.hash = '#settings'; });
        document.body.appendChild(t);
        setTimeout(function () { if (t.parentNode) t.remove(); }, 8000);
      }
      if (typeof QRUpdateManager !== 'undefined') {
        QRUpdateManager.init({
          swUrl: 'sw.js',
          appKey: 'qr_admin',
          onUpdateAvailable: function (shouldToast) {
            if (window.SettingsView && SettingsView.notifyUpdate) SettingsView.notifyUpdate();
            if (shouldToast) showUpdateToast();
          },
          onUpdated: function () { if (window.Toast) Toast.success('✅ App updated successfully'); }
        });
      }
    })();
  </script>
</body>
</html>
