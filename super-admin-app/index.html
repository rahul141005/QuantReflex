<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f8fafc" />
  <meta name="description" content="QuantReflex Super Admin Panel — Manage users, questions, and system operations." />
  <title>QuantReflex Admin</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="stylesheet" href="css/admin-style.css" />
</head>
<body>

  <!-- ==================== LOGIN SCREEN ==================== -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">QR</div>
        <h1 class="login-title">Admin Portal</h1>
        <p class="login-subtitle">Super Admin Access Only</p>
      </div>
      <div id="loginForm">
        <div class="login-field">
          <label for="loginEmail" class="login-label">Email</label>
          <input type="email" id="loginEmail" class="login-input" placeholder="admin@quantreflex.com" autocomplete="email" autocapitalize="off" />
        </div>
        <div class="login-field">
          <label for="loginPassword" class="login-label">Password</label>
          <input type="password" id="loginPassword" class="login-input" placeholder="Enter your password" autocomplete="current-password" />
        </div>
        <div id="loginError" class="login-error" style="display:none;"></div>
        <button id="loginBtn" class="btn accent login-btn">Secure Login</button>
      </div>
      <p class="login-footer">🔒 Protected by Firebase Authentication</p>
    </div>
  </div>

  <!-- ==================== APP SHELL ==================== -->
  <div id="appShell" class="app-shell" style="display:none;">

    <!-- Mobile Header -->
    <header class="mobile-header d-md-none">
      <button id="menuToggleBtn" class="menu-toggle" aria-label="Toggle Menu">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="mobile-brand">QR Admin</div>
      <div style="width:24px;"></div> <!-- spacer -->
    </header>

    <!-- Sidebar Overlay -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">QR</div>
        <div class="sidebar-title">QuantReflex</div>
      </div>
      <nav class="sidebar-nav">
        <a href="#command-center" class="nav-item active" data-view="command-center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg><span class="nav-label">Command Center</span></a>
        <a href="#users" class="nav-item" data-view="users"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="nav-label">Users</span></a>
        <a href="#coachings" class="nav-item" data-view="coachings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-3"/></svg><span class="nav-label">Coachings</span></a>
        <a href="#revenue" class="nav-item" data-view="revenue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span class="nav-label">Revenue</span></a>
        <a href="#content" class="nav-item" data-view="content"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span class="nav-label">Content</span></a>
        <a href="#ai" class="nav-item" data-view="ai"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg><span class="nav-label">AI</span></a>
        <a href="#operations" class="nav-item" data-view="operations"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="nav-label">Operations</span></a>
        <button id="railCollapseBtn" type="button" aria-label="Collapse navigation"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg><span class="rail-label">Collapse</span></button>
      </nav>
      <div class="sidebar-footer">
        <button id="logoutBtn" class="btn btn-outline" style="width:100%;">Logout</button>
      </div>
    </aside>

    <!-- Main Content — V2 7-domain shell (ADR-019). Legacy view containers (system/security/
         firestore/notifications/exports/inactive) are created on demand inside the Operations tabs. -->
    <main class="main-content">
      <div id="view-command-center" class="view active"></div>
      <div id="view-users" class="view"></div>
      <div id="view-coachings" class="view"></div>
      <div id="view-payments" class="view"></div>
      <div id="view-questions" class="view"></div>
      <div id="view-ai" class="view"></div>
      <div id="view-operations" class="view"></div>
    </main>

  </div>

  <!-- ==================== USER 360 DRAWER ==================== -->
  <div id="userDrawerOverlay" class="drawer-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000;" onclick="UserDrawer.close()"></div>
  <div id="userDrawer" class="user-drawer" style="display:none; position:fixed; top:0; right:-400px; width:400px; max-width:100%; height:100%; background:#fff; z-index:1001; box-shadow:-4px 0 15px rgba(0,0,0,0.1); transition:right 0.3s ease; overflow-y:auto; display:flex; flex-direction:column;">
    <div style="padding:1rem; border-bottom:1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center; background:#f8fafc;">
      <h3 style="margin:0; font-size:1.1rem; color:#0f172a;">User 360 View</h3>
      <button onclick="UserDrawer.close()" style="background:none; border:none; font-size:1.5rem; cursor:pointer; color:#64748b;">&times;</button>
    </div>
    <div id="userDrawerContent" style="padding:1rem; flex:1;"></div>
  </div>

  <!-- ==================== GLOBAL SEARCH (Cmd+K) ==================== -->
  <div id="globalSearchOverlay" class="search-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15,23,42,0.7); z-index:2000; backdrop-filter:blur(4px);" onclick="GlobalSearch.close()">
    <div class="search-modal" style="width:90%; max-width:600px; margin:10vh auto; background:#fff; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,0.2); overflow:hidden;" onclick="event.stopPropagation()">
      <div style="padding:1rem; border-bottom:1px solid #e2e8f0; display:flex; align-items:center;">
        <span style="font-size:1.2rem; margin-right:0.5rem;">🔍</span>
        <input type="text" id="globalSearchInput" placeholder="Search by email, uid, or coaching ID..." style="width:100%; border:none; outline:none; font-size:1.1rem; padding:0.5rem;" autocomplete="off" />
      </div>
      <div id="globalSearchResults" style="max-height:400px; overflow-y:auto; background:#f8fafc;"></div>
    </div>
  </div>

  <!-- ==================== MODAL CONTAINER ==================== -->
  <div id="modalContainer"></div>

  <!-- ==================== TOAST ==================== -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- App Scripts (layered like main app) -->
  <script src="js/state/store.js"></script>
  <script src="js/firebase/firebase.js"></script>
  <script src="js/firebase/security-events.js"></script>
  <script src="../shared/validation/auth-validators.js"></script>
  <script src="js/firebase/auth.js"></script>
  <script src="js/services/api.js"></script>
  <script src="js/ui/toast.js"></script>
  <script src="js/ui/modal.js"></script>
  <script src="js/ui/table.js"></script>
  <script src="js/ui/split.js"></script>
  <script src="js/ui/tabs.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/views/users.js"></script>
  <script src="js/views/inactive.js"></script>
  <script src="js/views/coachings.js"></script>
  <script src="js/views/payments.js"></script>
  <script src="js/views/questions.js"></script>
  <script src="js/views/ai.js"></script>
  <script src="js/views/system.js"></script>
  <script src="js/views/notifications.js"></script>
  <script src="js/views/exports.js"></script>
  <script src="js/views/security.js"></script>
  <script src="js/views/firestore-ops.js"></script>
  <script src="js/views/operations.js"></script>
  <script src="js/views/command-center.js"></script>
  <script src="js/app.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => {
          console.error('ServiceWorker registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>
